server:
  port: 8081

spring:
  application:
    name: agent-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

vaadin:
  # 限定 Vaadin 类扫描范围，加快启动
  allowed-packages: com.example.agent

# sa-token 登录会话配置（会话持久化到 Redis，重启不丢）
sa-token:
  token-name: satoken
  timeout: 604800
  is-log: false
  is-read-cookie: true
